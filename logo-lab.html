<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Pyon Mart logo lab</title>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<style>
  body { margin: 0; padding: 20px; font-family: system-ui, sans-serif; background: #f4f5f7; color: #333; }
  .row { display: flex; gap: 18px; flex-wrap: wrap; margin-bottom: 18px; align-items: center; }
  .card { background: #fff; border-radius: 12px; padding: 14px; box-shadow: 0 1px 3px #0001; text-align: center; font-size: 12px; }
  .dark { background: #1d2230; color: #ddd; }
</style>
</head>
<body>
  <div class="row" id="hero"></div>
  <div class="row" id="marks"></div>
  <div class="row" id="lockups"></div>
  <script type="module">
    import { VARIANTS, logoLockup } from './src/logo.js';
    document.getElementById('hero').innerHTML =
      `<div class="card">${VARIANTS.badge({ size: 380 })}</div><div class="card">${VARIANTS.rim({ size: 380 })}</div>`;
    const marks = document.getElementById('marks');
    for (const [name, fn] of Object.entries(VARIANTS)) {
      marks.insertAdjacentHTML('beforeend', `<div class="card">${fn({ size: 150 })}<div>${name} ${fn({ size: 40 })} ${fn({ size: 20 })}</div></div>`);
    }
    const l = document.getElementById('lockups');
    l.insertAdjacentHTML('beforeend', `<div class="card">${logoLockup({ width: 520 })}</div>`);
    l.insertAdjacentHTML('beforeend', `<div class="card dark">${logoLockup({ width: 520, dark: true })}</div>`);
  </script>
</body>
</html>
